name: Sync Garmin Global to Garmin CN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

env:
  GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
  GARMIN_GLOBAL_USERNAME: ${{ secrets.GARMIN_GLOBAL_USERNAME }}
  GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
  GARMIN_SYNC_NUM: "3"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Sync Garmin Global to Garmin CN
    permissions:
      contents: write
    concurrency:
      group: garmin-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Random Delay
        run: |
          DELAY=$((RANDOM % 600))
          echo "Delay ${DELAY}s to avoid traffic peak..."
          sleep ${DELAY}

      - run: yarn

      - name: Run Sync
        run: |
          for attempt in {1..3}; do
            echo "===== Attempt $attempt/3 ====="
            yarn sync_global
            if [ $? -eq 0 ]; then
              echo "✅ Sync SUCCESS!"
              exit 0
            fi
            echo "❌ Failed, wait 12min before retry..."
            sleep 720
          done
          echo "❌ All attempts failed"
          exit 1
        timeout-minutes: 40

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Save Garmin Session
          skip_if_no_changes: true
