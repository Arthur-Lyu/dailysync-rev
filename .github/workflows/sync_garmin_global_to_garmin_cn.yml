name: Sync Garmin Global to Garmin CN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

env:
  GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
  GARMIN_GLOBAL_USERNAME: ${{ secrets.GARMIN_GLOBAL_USERNAME }}
  GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
  GARMIN_SYNC_NUM: "10"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Sync Garmin Global to Garmin CN
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      # ← 关键：把 session DB 文件在两次运行之间缓存起来
      - name: Cache Garmin Session DB
        uses: actions/cache@v4
        with:
          path: ./db/garmin.db
          key: garmin-session-db

      - run: yarn

      - name: Run Sync (with retry)
        run: |
          for attempt in {1..3}; do
            echo "===== Attempt $attempt/3 ====="
            yarn sync_global && echo "✅ Sync SUCCESS!" && exit 0
            echo "❌ Failed, wait 10min before retry..."
            sleep 600
          done
          echo "❌ All 3 attempts failed"
          exit 1
        timeout-minutes: 45

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Save Garmin Session
          skip_if_no_changes: true
